# dsh-plugin-reverse-proxy — 反代 + 免 Token 登录（合并版 0.2.0）
#
# 两条能力，同一个包：
#   1) 反向代理：0.0.0.0:8080 → 127.0.0.1:3080（改写 Host/Origin/Sec-Fetch-Site）
#   2) 免 Token 登录：替换官方 Connection 提供方跳过 BrowserAuth（web-only，版本门控）
#
# 第 2 条只在版本门控命中时生效；不命中则官方 connection 原样保留（自动休眠）。
# 免登录部分源码参考并内联自 @iasiv5/dsh-skip-browser-auth（MIT，见 vendor/skip/LICENSE）。

