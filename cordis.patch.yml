# 反向代理本体：与免登录替换互不依赖，始终生效
- insert:
    - id: dsh-plugin-reverse-proxy
      name: 'dsh-plugin-reverse-proxy'
      config:
        listenHost: '0.0.0.0'
        listenPort: 8080
        listenIpv6: false
        upstreamHost: '127.0.0.1'
        upstreamPort: 3080
        upstreamHostHeader: '127.0.0.1:3080'
        upstreamOrigin: 'http://127.0.0.1:3080'
        maxBodyBytes: 209715200
        retryMs: 5000
